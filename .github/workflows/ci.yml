name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test contribution checker
        run: node --test scripts/check-dco.test.cjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install public Python test dependencies
        run: python -m pip install --disable-pip-version-check --requirement engine/requirements-dev.txt

      - name: Build frontend
        run: bun run build

      - name: Run frontend tests
        run: bun run test:web

      - name: Run Python tests with synthetic inputs
        run: python -m pytest tests

      - name: Prepare Core runtime for Rust process tests
        shell: pwsh
        run: .\scripts\prepare-runtime.ps1 -Edition Core -Rebuild

      - name: Run Rust tests
        shell: pwsh
        run: |
          $env:PDF_SEARCH_TEST_PYTHON = (Get-Command python).Source
          cargo test --manifest-path src-tauri/Cargo.toml --locked
